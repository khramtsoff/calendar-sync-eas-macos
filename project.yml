name: CalendarSync
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.mailclient
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: JF25G9C7A8
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
targets:
  CalendarSync:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CalendarSync
        excludes:
          - "Resources/Info.plist"
          - "Resources/CalendarSync.entitlements"
    resources:
      - path: CalendarSync/Assets.xcassets
        optional: true
    info:
      path: CalendarSync/Resources/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: CalendarSync
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSCalendarsUsageDescription: "CalendarSync mirrors Exchange ActiveSync calendar events into a dedicated local calendar so you can see meetings in the system Calendar app."
        NSCalendarsFullAccessUsageDescription: "CalendarSync mirrors Exchange ActiveSync calendar events into a dedicated local calendar so you can see meetings in the system Calendar app."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: CalendarSync/Resources/CalendarSync.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mailclient.MailClient
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          DEVELOPMENT_TEAM: JF25G9C7A8
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
